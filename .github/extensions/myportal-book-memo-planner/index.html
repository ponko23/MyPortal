<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Memo カンバン</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/client.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <p class="eyebrow">BOOK MEMO / PROJECT BOARD</p>
          <h1>Book Memo カンバン</h1>
          <p class="intro">要件を機能カードにまとめ、実装や検討事項を子タスクとして進めます。</p>
        </div>
        <div class="header-actions">
          <button class="button button-secondary" id="add-card" type="button">＋ カード追加</button>
          <button class="button button-primary" id="save-board" type="button" disabled>変更を保存</button>
        </div>
      </header>

      <section class="goal-panel" aria-labelledby="goal-title">
        <div>
          <p class="section-label" id="goal-title">プロジェクトの目的</p>
          <p id="goal" class="goal-text"></p>
        </div>
        <p id="board-status" role="status" aria-live="polite">カンバンを読み込んでいます…</p>
      </section>

      <section class="board" id="board" aria-label="Book Memo 作業カンバン"></section>
    </main>

    <dialog id="card-dialog" aria-labelledby="dialog-title">
      <form id="card-form" method="dialog">
        <div class="dialog-heading">
          <h2 id="dialog-title">カードを追加</h2>
          <button class="icon-button" id="close-dialog" type="button" aria-label="閉じる">×</button>
        </div>
        <input id="card-id" name="id" type="hidden">
        <div class="field">
          <label for="card-title">タイトル</label>
          <input id="card-title" name="title" type="text" maxlength="200" required>
        </div>
        <div class="field">
          <label for="card-description">説明・受け入れ条件</label>
          <textarea id="card-description" name="description" rows="4" maxlength="3000"></textarea>
        </div>
        <div class="fields-grid">
          <div class="field">
            <label for="card-type">カード種別</label>
            <select id="card-type" name="type">
              <option value="epic">機能（親）</option>
              <option value="task">タスク（子）</option>
              <option value="decision">仕様判断</option>
              <option value="scenario">利用場面</option>
            </select>
          </div>
          <div class="field">
            <label for="card-priority">優先度</label>
            <select id="card-priority" name="priority">
              <option value="must">必須</option>
              <option value="should">できれば必要</option>
              <option value="could">余裕があれば</option>
              <option value="wont">今回は対象外</option>
            </select>
          </div>
        </div>
        <div class="fields-grid">
          <div class="field">
            <label for="card-column">列</label>
            <select id="card-column" name="columnId"></select>
          </div>
          <div class="field">
            <label for="card-parent">親機能</label>
            <select id="card-parent" name="parentId">
              <option value="">なし</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="card-labels">ラベル（カンマ区切り）</label>
          <input id="card-labels" name="labels" type="text" maxlength="500" placeholder="例: 要件整理, ISBN">
        </div>
        <div class="dialog-actions">
          <button class="button button-secondary" id="cancel-dialog" type="button">キャンセル</button>
          <button class="button button-primary" type="submit">カードを保存</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
